  <!-- Bottom tier wavy frosting -->
  <path d="M11 30C12.5 32 14.5 32 16 30C17.5 32 20.5 32 22 30C23.5 32 26.5 32 28 30C29.5 32 32.5 32 34 30C35.5 32 36.5 31.5 37 30" stroke="#E5A93C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cake plate base -->
