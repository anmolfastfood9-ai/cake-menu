<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Candle flame -->
  <path d="M24 6.5C24 6.5 22 9.5 22 11C22 12.1 22.9 13 24 13C25.1 13 26 12.1 26 11C26 9.5 24 6.5 24 6.5Z" fill="#F5C443" filter="url(#gold-glow)"/>

