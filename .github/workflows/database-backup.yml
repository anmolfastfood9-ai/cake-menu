name: Automated Offsite Database Backup

on:
  schedule:
    # Daily at 02:00 UTC (07:30 IST)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate and verify archive without uploading to object storage)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: backup-db-production
  cancel-in-progress: false

jobs:
  backup:
    name: Neon DB Backup & Encrypted Offsite Upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 Client via Official PGDG
        run: |
          set -euo pipefail

          # Purge any pre-installed distro packages and wrappers
          sudo apt-get remove -y --purge postgresql-client-common postgresql-client-16 postgresql-client-14 postgresql-client-15 || true
          sudo apt-get autoremove -y -qq || true

          # Install repository prerequisites
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release age gzip

          # Install official PostgreSQL PGDG signing key
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          # Add PGDG repository dynamically using the runner's Ubuntu codename
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          # Update and install PostgreSQL 18 client explicitly
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18

          # Enforce symlinks in /usr/local/bin to guarantee PATH precedence
          sudo ln -sf /usr/lib/postgresql/18/bin/pg_dump /usr/local/bin/pg_dump
          sudo ln -sf /usr/lib/postgresql/18/bin/pg_restore /usr/local/bin/pg_restore
          sudo ln -sf /usr/lib/postgresql/18/bin/psql /usr/local/bin/psql

          # Export to runner PATH
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL 18 Client Binaries
        run: |
          set -euo pipefail

          # 1. Test explicit PostgreSQL 18 binaries directly
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

          # 2. Inspect path resolution
          which pg_dump
          readlink -f "$(which pg_dump)"

          # 3. Verify version string contains 18.x
          PG_DUMP_VER=$(/usr/lib/postgresql/18/bin/pg_dump --version)
          PG_RESTORE_VER=$(/usr/lib/postgresql/18/bin/pg_restore --version)

          if ! echo "$PG_DUMP_VER" | grep -q "18\."; then
            echo "::error::pg_dump is not PostgreSQL 18! Aborting."
            exit 1
          fi

          if ! echo "$PG_RESTORE_VER" | grep -q "18\."; then
            echo "::error::pg_restore is not PostgreSQL 18! Aborting."
            exit 1
          fi

      - name: Verify Neon Database Server Version
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty!"
            exit 1
          fi

          echo "Querying PostgreSQL server version..."
          SERVER_VER=$(/usr/lib/postgresql/18/bin/psql "$DATABASE_URL" -tAc "SHOW server_version;")
          echo "Neon PostgreSQL server version: $SERVER_VER"

          if ! echo "$SERVER_VER" | grep -q "18\."; then
            echo "::warning::Server version is not 18.x: $SERVER_VER"
          fi

      - name: Generate Timestamp and Archive Filename
        id: meta
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%d-%H-%M')
          DUMP_NAME="raman-sweet-bakery-prod-${TIMESTAMP}.dump"
          ARCHIVE_NAME="${DUMP_NAME}.age"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "dump_name=${DUMP_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Perform Logical PostgreSQL Dump (Custom Format)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty!"
            exit 1
          fi

          mkdir -p backups
          DUMP_PATH="backups/${{ steps.meta.outputs.dump_name }}"

          # Use absolute PostgreSQL 18 pg_dump binary to guarantee no older binary is ever executed
          /usr/lib/postgresql/18/bin/pg_dump \
            --dbname="$DATABASE_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file="$DUMP_PATH"

          # Verify dump is non-empty
          if [ ! -s "$DUMP_PATH" ]; then
            echo "::error::pg_dump produced an empty or missing file!"
            exit 1
          fi

          SIZE=$(stat -c%s "$DUMP_PATH")
          echo "pg_dump successful. Unencrypted dump size: ${SIZE} bytes."

      - name: Verify Dump Archive Readability (Metadata-Only Test)
        run: |
          set -euo pipefail

          DUMP_PATH="backups/${{ steps.meta.outputs.dump_name }}"

          # Use absolute PostgreSQL 18 pg_restore binary to verify table of contents
          /usr/lib/postgresql/18/bin/pg_restore --list "$DUMP_PATH" > /dev/null
          echo "pg_restore table-of-contents validation passed."

      - name: Encrypt Backup Archive using age
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY secret is missing or empty!"
            exit 1
          fi

          DUMP_PATH="backups/${{ steps.meta.outputs.dump_name }}"
          ARCHIVE_PATH="backups/${{ steps.meta.outputs.archive_name }}"

          # Pass encryption passphrase via standard input securely without shell tracing
          printf "%s" "$BACKUP_ENCRYPTION_KEY" | age -p -o "$ARCHIVE_PATH" "$DUMP_PATH"

          if [ ! -s "$ARCHIVE_PATH" ]; then
            echo "::error::Encrypted archive is empty or missing!"
            exit 1
          fi

          ENC_SIZE=$(stat -c%s "$ARCHIVE_PATH")
          echo "Encryption complete. Encrypted size: ${ENC_SIZE} bytes."

          # Securely shred and delete unencrypted dump from runner disk immediately
          rm -f "$DUMP_PATH"

      - name: Self-Test Decryption Integrity
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="backups/${{ steps.meta.outputs.archive_name }}"
          VERIFY_DUMP="backups/verify.dump"

          # Decrypt into temporary verification file
          printf "%s" "$BACKUP_ENCRYPTION_KEY" | age -d -o "$VERIFY_DUMP" "$ARCHIVE_PATH"

          # Verify decrypted file is readable by absolute PostgreSQL 18 pg_restore
          /usr/lib/postgresql/18/bin/pg_restore --list "$VERIFY_DUMP" > /dev/null
          echo "Verification passed: Archive is decryptable and contains valid PostgreSQL catalog."

          # Clean up verification artifact
          rm -f "$VERIFY_DUMP"

      - name: Upload to Offsite Storage (Cloudflare R2 / AWS S3)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'auto' }}
          BACKUP_BUCKET_NAME: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_ENDPOINT_URL: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="backups/${{ steps.meta.outputs.archive_name }}"
          ARCHIVE_FILE="${{ steps.meta.outputs.archive_name }}"

          # If storage credentials are not provided yet, warn gracefully in logs
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${BACKUP_BUCKET_NAME:-}" ]; then
            echo "::warning::Storage credentials (BACKUP_STORAGE_ACCESS_KEY_ID or BUCKET) not configured. Archive was encrypted & verified locally."
            exit 0
          fi

          pip install -q awscli

          EXTRA_ARGS=""
          if [ -n "${BACKUP_ENDPOINT_URL:-}" ]; then
            EXTRA_ARGS="--endpoint-url ${BACKUP_ENDPOINT_URL}"
          fi

          # Upload encrypted archive to private bucket under daily backups folder
          aws s3 cp "$ARCHIVE_PATH" "s3://${BACKUP_BUCKET_NAME}/backups/${ARCHIVE_FILE}" $EXTRA_ARGS

          echo "Successfully uploaded ${ARCHIVE_FILE} to offsite storage bucket: ${BACKUP_BUCKET_NAME}."
